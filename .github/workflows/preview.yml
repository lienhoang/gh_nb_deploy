name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Ruby environment for Jekyll
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Match your local Ruby version
          bundle-cache: true   # Automatically caches your gems

      # 2. Compile Jekyll with a dynamic baseurl matching the PR folder path
      - name: Build Jekyll Site
        run: |
          bundle install
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}"

      # 3. Push compiled '_site' directory to GitHub Pages branch
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site # Jekyll defaults to writing files to _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Clean up PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
