name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && 
      startsWith(github.head_ref, 'gh-page/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: true

      # FIX: Run the bundle install and jekyll build strictly INSIDE the docs directory
      - name: Build Jekyll Site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}"

      # The files are now built inside "docs/_site"
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && 
      startsWith(github.head_ref, 'gh-page/')
    steps:
      # FIX: Initialize the repository inside the cleanup environment
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean up PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
