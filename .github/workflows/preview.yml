name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    # ... keep the top metadata sections the exact same ...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: true

      # 1. Update the Jekyll Build Command to use the --source flag
      - name: Build Jekyll Site
        run: |
          bundle install
          bundle exec jekyll build --source docs --baseurl "/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}"

      # 2. Update the source folder to point to the new location inside docs
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site # Jekyll now builds inside docs/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Clean up PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site # Ensure cleanup targets the same folder
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
