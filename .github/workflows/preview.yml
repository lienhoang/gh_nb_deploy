name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'gh-page/')
    environment:
      name: github-pages # Links the job to the official deployment environment
      url: ${{ steps.deployment.outputs.page_url }} # Optional: captures url if action exports it
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: true

      - name: Build Jekyll Site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}"

      - name: Deploy PR Preview
        id: deployment
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && startsWith(github.head_ref, 'gh-page/')
    environment:
      name: github-pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Clean up PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove